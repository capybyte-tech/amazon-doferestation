<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazonia // Live Canopy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
<div id="stage">
  <img id="hero" alt="Isometric render of Amazon canopy: intact forest on the left, burning cleared plots on the right" src="assets/hero.jpg">
  <canvas id="embers" width="792" height="505"></canvas>
  <svg id="ui" viewBox="0 0 1672 941" tabindex="0" aria-label="Amazon deforestation, fire hotspots and ENSO dashboard. Use left and right arrow keys to change year.">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glowBig" x="-50%" y="-200%" width="200%" height="500%">
        <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
      <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2fae5c" stop-opacity=".62"/>
        <stop offset="1" stop-color="#0f3a22" stop-opacity=".55"/>
      </linearGradient>
      <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffb93d"/><stop offset=".55" stop-color="#f09a22"/><stop offset="1" stop-color="#c9730f"/>
      </linearGradient>
      <linearGradient id="gBarHi" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f09a22"/>
      </linearGradient>
      <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff6a4a" stop-opacity="1"/><stop offset=".6" stop-color="#ff3b2e" stop-opacity=".7"/><stop offset="1" stop-color="#ff2d2d" stop-opacity=".25"/>
      </linearGradient>
      <linearGradient id="gCyan" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#5ae8ff" stop-opacity="1"/><stop offset=".6" stop-color="#27c3e6" stop-opacity=".7"/><stop offset="1" stop-color="#1fb6d9" stop-opacity=".25"/>
      </linearGradient>
      <linearGradient id="gUnder" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#18a9c4" stop-opacity=".16"/><stop offset="1" stop-color="#18a9c4" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gState" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#3fcf6e"/><stop offset="1" stop-color="#6ff29a"/>
      </linearGradient>
      <linearGradient id="gFade" gradientUnits="userSpaceOnUse" x1="0" y1="355" x2="0" y2="860">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".12" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/>
      </linearGradient>
    </defs>

    <!-- ===== HERO OVERLAYS ===== -->
    <g id="title">
      <text x="31" y="33" font-size="22" font-weight="500" fill="#f1f4f4" letter-spacing="0.1">AMAZONIA // LIVE CANOPY</text>
      <text x="32" y="57" font-size="15" font-weight="400" fill="#d3d9d9" letter-spacing="0">Brazilian Legal Amazon · 1999-2019</text>
      <g stroke="#cfd6d6" stroke-width="1.6"><line x1="33" y1="74" x2="50" y2="74"/><line x1="56" y1="74" x2="73" y2="74"/><line x1="79" y1="74" x2="96" y2="74"/></g>
    </g>

    <g id="stateBlock">
      <text x="1372" y="26" font-size="13" fill="#dfe5e5" letter-spacing=".4">DEFORESTATION BY STATE</text>
      <text id="stateSub" x="1372" y="46" font-size="13" fill="#c5cccc" letter-spacing=".4">2004-2019 (km²)</text>
      <line x1="1476.5" y1="64" x2="1476.5" y2="161" stroke="#9aa4a7" stroke-width="1.2"/>
      <g id="stateRows"></g>
    </g>

    <g id="callout">
      <circle id="pulse" cx="1058" cy="211" r="11" fill="none" stroke="#fff" stroke-width="1.2"/>
      <circle cx="1058" cy="211" r="11" fill="rgba(0,0,0,.25)" stroke="#fff" stroke-width="1.8" filter="url(#glow)"/>
      <circle cx="1058" cy="211" r="3.6" fill="#fff"/>
      <line x1="1066" y1="202" x2="1135" y2="87" stroke="#fff" stroke-width="1.3"/>
      <line id="coLine" x1="1135" y1="87" x2="1323" y2="87" stroke="#fff" stroke-width="1.3"/>
      <text id="coTitle" x="1146" y="79" font-size="17" font-weight="600" fill="#fff" letter-spacing=".8">2019 · PARÁ</text>
      <text id="coL1" x="1146" y="107" font-size="13.5" fill="#eef2f2" letter-spacing=".6"></text>
      <text id="coL2" x="1146" y="127" font-size="13.5" fill="#eef2f2" letter-spacing=".6"></text>
      <text id="coL3" x="1146" y="146" font-size="13.5" fill="#eef2f2" letter-spacing=".6"></text>
    </g>

    <!-- ===== BOTTOM PANEL ===== -->
    <line x1="0" y1="547" x2="1672" y2="547" stroke="rgba(255,255,255,.28)" stroke-width="1.2"/>

    <g id="kpis">
      <text x="30" y="576" fill="#f3f6f6"><tspan id="kpi1" font-size="23" font-weight="600" letter-spacing=".4">160,335 km²</tspan><tspan font-size="18" font-weight="400" letter-spacing=".7" dx="9">LOST</tspan></text>
      <text x="31" y="597" font-size="14" fill="#b9c1c2" letter-spacing=".2">TOTAL DEFORESTATION 2004-2019</text>
      <line x1="353.5" y1="556" x2="353.5" y2="600" stroke="rgba(255,255,255,.28)"/>
      <text x="390" y="576" fill="#f3f6f6"><tspan id="kpi2" font-size="23" font-weight="600" letter-spacing=".4">2,456,247</tspan><tspan font-size="18" font-weight="400" letter-spacing=".7" dx="9">FIRE HOTSPOTS</tspan></text>
      <text x="391" y="597" font-size="14" fill="#b9c1c2" letter-spacing=".2">TOTAL 1999-2019</text>
      <line x1="775.5" y1="556" x2="775.5" y2="600" stroke="rgba(255,255,255,.28)"/>
      <text x="815" y="576" fill="#f3f6f6"><tspan id="kpi3" font-size="23" font-weight="600" letter-spacing=".4">r = 0.83</tspan><tspan font-size="18" font-weight="400" letter-spacing=".7" dx="9">ASSOCIATION</tspan></text>
      <text id="kpi3a" x="815" y="591" font-size="11.5" fill="#b9c1c2" letter-spacing=".5">BETWEEN ANNUAL DEFORESTATION AND FIRE HOTSPOTS</text>
      <text id="kpi3b" x="815" y="606" font-size="11.5" fill="#b9c1c2" letter-spacing=".5">(NOT CAUSATION)</text>
    </g>

    <g id="legend"></g>

    <!-- panel labels -->
    <g font-size="14.5" letter-spacing=".3">
      <text x="30" y="650" fill="var(--green)" class="caps">DEFORESTATION</text>
      <text x="30" y="671" fill="var(--green)">(km² per year)</text>
      <text x="30" y="734" fill="var(--orange)" class="caps">FIRE HOTSPOTS</text>
      <text x="30" y="754" fill="var(--orange)">(per year)</text>
      <text x="30" y="812" fill="var(--cyan)" class="caps">ENSO</text>
      <text x="30" y="832" fill="var(--cyan)">(ocean index)</text>
    </g>

    <g id="axes"></g>
    <g id="pDefor" class="dim"></g>
    <g id="pFire" class="dim"></g>
    <g id="pEnso" class="dim"></g>
    <g id="xAxis"></g>
    <g id="cursor" pointer-events="none"></g>
    <rect id="hit" x="236" y="612" width="1422" height="262" fill="transparent"/>

    <g id="bottomLegend" font-size="12" fill="#cfd6d6" letter-spacing=".3"></g>
  </svg>
</div>
</div>

<main id="m" aria-label="Amazonia dashboard">
  <header class="m-head">
    <h1>AMAZONIA // LIVE CANOPY</h1>
    <p>Brazilian Legal Amazon · 1999-2019</p>
    <div class="m-dashes" aria-hidden="true"><i></i><i></i><i></i></div>
  </header>
  <div class="m-hero" id="mHero">
    <img src="assets/hero.jpg" alt="Isometric render of Amazon canopy: intact forest on the left, burning cleared plots on the right">
    <div class="m-marker" id="mMarker" aria-hidden="true"></div>
  </div>
  <section class="m-callout" aria-live="polite">
    <h2 id="mCoTitle"></h2>
    <p id="mCoL1"></p><p id="mCoL2"></p><p id="mCoL3"></p>
  </section>
  <section class="m-sec">
    <div class="m-cap">DEFORESTATION BY STATE</div>
    <div class="m-sub" id="mStateSub"></div>
    <div id="mStateRows" class="m-rows"></div>
  </section>
  <section class="m-sec m-kpis">
    <div class="m-kpi"><div class="big" id="mK1"></div><div class="small">TOTAL DEFORESTATION 2004-2019</div></div>
    <div class="m-kpi"><div class="big" id="mK2"></div><div class="small">TOTAL 1999-2019</div></div>
    <div class="m-kpi"><div class="big" id="mK3"></div><div class="small" id="mK3a"></div></div>
  </section>
  <section class="m-sec">
    <div class="m-legend" id="mLegend"></div>
    <div class="m-year">
      <label for="mYear">Year</label>
      <input type="range" id="mYear" min="1999" max="2019" step="1" value="2019">
      <output id="mYearOut" for="mYear">2019</output>
    </div>
    <div id="mCharts"></div>
    <div class="m-blegend" id="mBLegend"></div>
  </section>
</main>

<script src="vendor/d3.min.js"></script>
<script src="data/data.js"></script>
<script src="js/main.js"></script>
<script src="js/mobile.js"></script>
</body>
</html>
